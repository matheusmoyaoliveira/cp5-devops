<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Início')}"></head>

<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Bem-vindo ao <span class="logo-dimdim">dimdim</span></h1>
        <p class="lead text-muted">Gestão de clientes e transações do banco digital DimDim,
            rodando em Azure Web App com Azure SQL Database.</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-5">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h4">Clientes</h2>
                    <p class="text-muted">Cadastre, consulte, edite e exclua clientes.</p>
                    <a th:href="@{/clientes}" class="btn btn-dimdim">Ver clientes</a>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h4">Transações</h2>
                    <p class="text-muted">Registre depósitos, saques, PIX, transferências e pagamentos.</p>
                    <a th:href="@{/transacoes}" class="btn btn-dimdim">Ver transações</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
