<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | DimDim'">DimDim</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/dimdim.css}">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-dimdim shadow-sm">
    <div class="container">
        <a class="navbar-brand logo-dimdim" th:href="@{/}">dimdim</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/clientes}">Clientes</a>
            <a class="nav-link" th:href="@{/transacoes}">Transações</a>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
</div>

</html>
