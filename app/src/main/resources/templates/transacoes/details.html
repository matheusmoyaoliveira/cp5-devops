<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head('Detalhes da transação')}"></head>

<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container py-4" style="max-width: 820px;">
    <h1 class="h3 titulo-pagina mb-4" th:text="'Transação #' + ${transacao.id}">Transação #1</h1>

    <div class="card card-body shadow-sm mb-4">
        <dl class="row mb-0">
            <dt class="col-sm-3">Cliente</dt>
            <dd class="col-sm-9">
                <a th:href="@{/clientes/{id}(id=${transacao.cliente.id})}"
                   th:text="${transacao.cliente.nome}">Ana Souza</a>
            </dd>
            <dt class="col-sm-3">Tipo</dt>
            <dd class="col-sm-9" th:text="${transacao.tipo.descricao}">Depósito</dd>
            <dt class="col-sm-3">Descrição</dt>
            <dd class="col-sm-9" th:text="${transacao.descricao}">Depósito salário</dd>
            <dt class="col-sm-3">Valor</dt>
            <dd class="col-sm-9"
                th:text="'R$ ' + ${#numbers.formatDecimal(transacao.valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</dd>
            <dt class="col-sm-3">Data</dt>
            <dd class="col-sm-9"
                th:text="${#temporals.format(transacao.dataTransacao, 'dd/MM/yyyy HH:mm')}">04/10/2026</dd>
        </dl>
    </div>

    <div class="d-flex flex-wrap gap-2">
        <a th:href="@{/transacoes/{id}/editar(id=${transacao.id})}" class="btn btn-outline-primary">Editar</a>
        <form th:action="@{/transacoes/{id}(id=${transacao.id})}" th:method="delete"
              onsubmit="return confirm('Confirma a exclusão desta transação?');">
            <button type="submit" class="btn btn-outline-danger">Excluir</button>
        </form>
        <a th:href="@{/transacoes}" class="btn btn-outline-secondary">Voltar</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
