spring.application.name=dimdim

# Conexão com o Azure SQL - valores vêm das variáveis de ambiente
# (App Settings do Web App). Nunca escrever usuário/senha aqui.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# As tabelas são criadas pelo scripts/ddl-dimdim.sql.
# O Hibernate só confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL gerado no log (ajuda no vídeo e no Log Stream)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Permite que formulários HTML enviem PUT e DELETE
# (via campo escondido _method, gerado pelo th:method do Thymeleaf)
spring.mvc.hiddenmethod.filter.enabled=true

# Guarda a sessão só em cookie (sem ;jsessionid na URL)
server.servlet.session.tracking-modes=cookie